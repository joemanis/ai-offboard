<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ai-offboard{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f8cff'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='17' font-weight='800' fill='%230b1020' text-anchor='middle'%3EAO%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="mark">AO</span>
        <span>ai-offboard<span class="ver">v{{ version }}</span></span>
      </a>
      <nav class="navlinks">
        <a href="/">Audit</a>
        <a href="https://github.com/{{ repo }}" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span>ai-offboard — read-only AI access audit</span>
      <span>local-only · Apache-2.0</span>
    </div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
