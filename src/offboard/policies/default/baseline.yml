# AI access cleanup baseline policy set.
#
# These policies evaluate tenant-side AI access discovered by the scanner.
# Sign-in activity is optional context and is not part of core policy evaluation.
policies:
  - id: AI-001
    name: No disabled-account AI access
    description: Disabled accounts must not retain connected AI app assignments.
    severity: high
    check: stale_access
    applies_to: all
    default: true

  - id: AI-002
    name: No high-privilege AI app assignments
    description: High-DLP-tier AI apps require explicit review before access remains assigned.
    severity: high
    check: no_high_privilege_apps
    applies_to: all
    default: true

  - id: AI-003
    name: No broad AI OAuth grants
    description: AI-connected apps must not retain broad or sensitive Mail, Files, Directory, or Drive scopes without review.
    severity: high
    check: no_broad_grants
    applies_to: all
    default: true
    params:
      # ai-offboard must use broad read-only Graph access to inventory the
      # tenant. Keep this exact-name exclusion narrow and visible in policy.
      excluded_apps:
        - ai-offboard

  - id: AI-004
    name: Approved AI-app allowlist
    description: Connected AI apps must be on the business-approved allowlist. Unknown apps require review before remaining connected.
    severity: critical
    check: unapproved_apps
    applies_to: all
    default: true
    params:
      approved:
        - Microsoft 365 Copilot
