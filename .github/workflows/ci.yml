name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,web]"
      - name: Lint
        if: matrix.python-version == '3.11'
        run: ruff check .
      - name: Type check
        if: matrix.python-version == '3.11'
        run: mypy src/offboard tests
      - name: Test
        run: pytest -q

  package:
    name: Built package smoke test
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/ai-offboard-wheel-test
          WHEEL=$(ls dist/*.whl)
          /tmp/ai-offboard-wheel-test/bin/python -m pip install "${WHEEL}[web]"
          /tmp/ai-offboard-wheel-test/bin/offboard --version
          /tmp/ai-offboard-wheel-test/bin/offboard audit --mock --json > /tmp/ai-offboard.json
          /tmp/ai-offboard-wheel-test/bin/offboard policy list
          /tmp/ai-offboard-wheel-test/bin/python -c "import offboard.web; print('web import ok')"
          /tmp/ai-offboard-wheel-test/bin/python -c "import json; d=json.load(open('/tmp/ai-offboard.json')); assert 'enterprise_apps' in d and 'app_role_assignments' in d"
