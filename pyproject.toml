[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-offboard"
version = "0.4.3"
description = "Read-only AI tool audit + offboarding report for Microsoft 365 tenants."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["microsoft-365", "entra", "msp", "ai-governance", "offboarding", "audit", "shadow-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12",
    "requests>=2.31",
    "msal>=1.28",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# `pip install ai-offboard[web]` brings the local web UI + setup wizard extras
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.9", "httpx>=0.27"]

[project.scripts]
offboard = "offboard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# Critical: ship the runtime data files (catalog + web templates), or a wheel
# install would have an empty app catalog and a broken web UI.
[tool.setuptools.package-data]
offboard = ["catalog/*.json", "templates/*.html", "static/*.css", "policies/**/*.yml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]